[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 96
fail_on_revert = true

[fmt]
line_length = 110
